name: Update Profile README

on:
  schedule:
    - cron: '0 0 * * *' # 每日 UTC 00:00 更新一次
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update last updated line
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          if grep -q '^最后更新：' README.md; then
            sed -i "s/^最后更新：.*$/最后更新：$DATE/" README.md
          else
            echo -e "\n最后更新：$DATE" >> README.md
          fi
      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update last-updated" || echo "No changes to commit"
          git push